<style>
  /* ====== TOKENS (Jumphoria Gold) ====== */
  :root{
    --cream:#0B0B0A;
    --paper:#EFE3BE;
    --ink:#F7F3E8;
    --ink-on-paper:#F0EAD8;
    --accent-box-bg:#1D170D;
    --card-bg:#14120D;
    --input-ink:#2B2A22;
    --ink-soft:#E8E4D0;
    --pine:#D4AF37;
    --pine-dark:#B8912E;
    --terracotta:#D97B5E;
    --terracotta-soft:rgba(217,123,94,0.16);
    --line:rgba(212,175,55,0.22);
    --shadow: 0 10px 26px rgba(0,0,0,0.55), 0 1px 3px rgba(212,175,55,0.06);
    /* Auth/Login-Fenster: eigenes Schwarz-Gold-Thema, passend zur neuen Webador-Startseite */
    --auth-bg:#0B0B0B;
    --auth-bg-soft:#161616;
    --auth-text:#F5EFDD;
    --auth-line:#3A3A3A;
  }

  *{box-sizing:border-box;}
  html{ overflow-x:hidden; width:100%; }
  img, .card-photo, .detail-photo, .auth-logo, .brand-logo{ max-width:100%; }
  body{
    margin:0;
    overflow-x:hidden;
    width:100%;
    background:var(--cream);
    color:var(--ink);
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3, .recipe-title{
    font-family: Georgia, 'Times New Roman', serif;
    letter-spacing:-0.01em;
  }

  .app{
    max-width:1000px !important; width:100% !important; margin:0 auto !important;
    padding:24px 18px 80px !important; box-sizing:border-box !important;
    position:relative !important; left:0 !important; right:0 !important;
  }

  /* ====== HEADER ====== */
  .top{
    display:flex !important; align-items:center !important; justify-content:space-between !important;
    margin-bottom:28px !important; flex-wrap:wrap !important; gap:12px !important; width:100% !important;
  }
  .brand{ display:flex !important; align-items:center !important; gap:10px !important; }
  .brand-logo{ height:75px !important; width:auto !important; max-width:280px !important; display:block !important; image-rendering:high-quality; }
  /* Auf dem Handy (schmaler Bildschirm) Logo und Menüzeile mittig statt linksbündig anzeigen */
  @media (max-width:640px){
    .top{ justify-content:center !important; }
    .brand{ width:100% !important; justify-content:center !important; }
    .user-pill{ width:100%; justify-content:center; flex-wrap:wrap; }
  }
  .auth-logo{ height:auto !important; width:100% !important; max-width:230px !important; display:block !important; margin:0 auto 18px !important; image-rendering:high-quality; border-radius:16px; background:transparent; box-sizing:border-box; }
  .user-pill{
    display:flex; align-items:center; gap:10px;
    font-size:13px; color:var(--ink-soft);
  }
  .btn-ghost{
    background:none; border:1px solid var(--line); color:var(--ink-soft);
    padding:7px 14px; border-radius:20px; cursor:pointer; font-size:13px;
  }
  .btn-ghost:hover{ border-color:var(--terracotta); color:var(--terracotta); }

  /* ====== LANG SWITCHER ====== */
  .lang-switcher{ display:flex; gap:4px; align-items:center; }
  .lang-btn{
    background:none; border:1px solid var(--line); color:var(--ink-soft);
    padding:6px 10px; border-radius:16px; cursor:pointer; font-size:12.5px;
    font-weight:700; opacity:0.55; transition:all .15s;
  }
  .lang-btn.active{ opacity:1; border-color:var(--pine); color:var(--pine); background:rgba(201,153,59,0.14); }
  .lang-btn:hover{ opacity:1; }

  /* ====== BUTTONS ====== */
  .btn{
    background:var(--pine); color:#fff; border:none;
    padding:13px 22px; border-radius:12px; font-size:14.5px; min-height:44px;
    cursor:pointer; font-weight:600; transition:transform .18s cubic-bezier(.22,1,.36,1), background .2s ease, box-shadow .2s ease;
  }
  .btn:hover{ background:var(--pine-dark); box-shadow:0 4px 12px rgba(169,126,42,0.25); }
  .btn:active{ transform:scale(0.97); }
  .btn-outline{
    background:transparent; color:var(--pine); border:1.5px solid var(--pine);
    padding:11px 18px; border-radius:12px; font-size:14px; cursor:pointer; font-weight:600;
    transition:background .2s ease, color .2s ease, transform .18s cubic-bezier(.22,1,.36,1);
  }
  .btn-outline:hover{ background:var(--pine); color:#fff; }
  .btn-outline:active{ transform:scale(0.97); }
  .btn-danger{ color:var(--terracotta); background:none; border:none; cursor:pointer; font-size:13px; }
  .btn-block{ width:100%; }

  /* ====== AUTH CARD ====== */
  .auth-wrap{ display:flex; justify-content:center; padding-top:40px; background:var(--auth-bg); min-height:100vh; margin:-24px -18px -80px; }
  .auth-card{
    background:var(--auth-bg-soft); border-radius:18px; padding:36px 32px;
    box-shadow:0 0 0 1px rgba(201,153,59,0.15), 0 12px 32px rgba(0,0,0,0.55); max-width:380px; width:100%;
    border:1.5px solid var(--pine);
  }
  .auth-card h2{ font-size:24px; margin:0 0 4px; color:var(--pine); }
  .auth-sub{ color:var(--auth-text); opacity:0.8; font-size:14px; margin:0 0 24px; }
  .auth-card .field label{ color:var(--pine); opacity:0.9; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; color:var(--ink); opacity:0.85; margin-bottom:6px; font-weight:600; }
  .field input, .field select, .field textarea{
    width:100%; padding:11px 13px; border-radius:9px; border:1.5px solid var(--line);
    background:#fff; font-size:14px; color:var(--input-ink); font-family:inherit;
  }
  .auth-card .field input{ border:1.5px solid var(--auth-line); }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none; border-color:var(--pine);
  }
  .auth-toggle{ text-align:center; margin-top:18px; font-size:13.5px; color:var(--ink); opacity:0.75; }
  .auth-card .auth-toggle{ color:var(--auth-text); opacity:0.65; }
  .auth-toggle a{ color:var(--paper); font-weight:600; cursor:pointer; text-decoration:none; }
  .auth-card .auth-toggle a{ color:var(--pine); }
  .auth-error{
    background:#6B3530; color:#F5D5C8; border-radius:8px;
    padding:9px 12px; font-size:13px; margin-bottom:14px;
  }
  .auth-closed-notice{
    background:rgba(201,151,58,0.15); border:1px solid var(--pine);
    color:var(--auth-text); border-radius:10px; padding:14px 16px;
    font-size:13.5px; line-height:1.5; margin-bottom:16px; text-align:left;
  }

  /* ====== MAIN TABS (untere Menüleiste, fix am Bildschirmrand) ====== */
  .main-tabs{
    position:fixed; left:0; right:0; bottom:0; z-index:60;
    display:grid; grid-template-columns:repeat(4, 1fr);
    background:#0B0B0A; border-top:1px solid rgba(212,175,55,0.18);
    padding:10px 6px calc(10px + env(safe-area-inset-bottom, 0px));
    max-width:1000px; margin:0 auto;
  }
  .main-tab{
    background:none; border:none; padding:4px 3px;
    font-size:9.5px; font-weight:600; color:#6C6656; opacity:1; cursor:pointer;
    border-radius:10px; font-family:inherit; text-align:center; transition:all .15s;
    white-space:nowrap; display:flex; flex-direction:column; align-items:center; gap:4px;
    min-width:0; letter-spacing:.2px;
  }
  .main-tab-icon{ display:flex; align-items:center; justify-content:center; }
  .main-tab-icon svg{ width:19px; height:19px; transition:transform .2s ease; }
  .main-tab.active .main-tab-icon svg{ transform:scale(1.08); }
  .main-tab.active{
    color:var(--pine);
    background:none;
  }
  /* Platz für die fixe untere Leiste, damit der letzte Inhalt nicht verdeckt wird */
  .app{ padding-bottom:92px !important; }

  /* ====== TODAY VIEW ====== */
  .today-summary{
    background:var(--card-bg); border-radius:16px; padding:18px 20px;
    margin-bottom:20px; box-shadow:var(--shadow); border:1px solid var(--line);
  }
  .today-summary h3{ color:var(--pine-dark); font-size:16px; margin:0 0 12px; }
  .today-list{ display:flex; flex-direction:column; gap:10px; }
  .meal-section-label{
    font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;

  /* ====== RECIPE GRID ====== */
  .grid{

  /* ====== FAB ====== */
  .fab{

    z-index:40;
  }

  /* ====== MODAL ====== */
  .overlay{
    position:fixed; inset:0; background:rgba(51,41,31,0.45);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:50; overflow:hidden;
  }
  .modal{
    background:var(--card-bg); border-radius:18px 18px 0 0; max-width:560px; width:100%;
    height:90vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
    touch-action:pan-y;
    padding:30px 28px 40px; box-shadow:var(--shadow); position:relative;
    overscroll-behavior:contain;
    scrollbar-width:none; /* Firefox: Scrollbar ausblenden */
    -ms-overflow-style:none; /* alte Edge/IE: Scrollbar ausblenden */
  }
  .modal::-webkit-scrollbar{ display:none; } /* Chrome/Safari: Scrollbar ausblenden */
  .modal h2{ color:var(--pine-dark); margin:0 0 18px; font-size:22px; }

    font-size:22px; color:var(--terracotta); opacity:0.9; cursor:pointer; font-weight:700;

  .photo-drop{

  .ingredient-row{ display:flex; gap:6px; margin-bottom:8px; align-items:center; }

  .macro-field{ display:flex; flex-direction:column; gap:4px; flex:1; min-width:70px; }
  .macro-field span{ font-size:11px; color:var(--ink-on-paper); opacity:0.65; font-weight:600; }

  .tag-pick{

  /* ====== DETAIL VIEW ====== */

  .servings-stepper{

  .stepper-btn{

  .loading{ text-align:center; padding:60px; color:var(--ink-soft); }
  @media (max-width:480px){
    .row2{ grid-template-columns:1fr; }
  }
.ing-estimate{ color:#999; font-size:0.9em; font-style:italic; }

  .today-eaten-toggle{

    font-size:15px; cursor:pointer; flex-shrink:0; font-weight:700;

  /* ====== TAGES-ERNÄHRUNGSÜBERSICHT ====== */

  .side-pick-item{

  .side-pick-item:hover{ border-color:var(--pine); }
  .side-gram-row{ display:flex; gap:8px; flex-wrap:wrap; margin:16px 0; }
  .side-gram-btn{
    flex:1; min-width:60px; padding:11px 6px; border-radius:10px; border:1.5px solid var(--line);
    background:#fff; color:var(--input-ink); font-size:14px; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .side-gram-btn.active{ background:var(--pine); border-color:var(--pine); color:#fff; }
  .side-extra-entry{
    background:var(--cream); border-radius:12px; padding:10px 14px;
    display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; font-size:13.5px;
  }
  .menu-list-item{
    display:flex; align-items:center; gap:14px; width:100%; text-align:left;
    background:var(--card-bg); border:1px solid var(--line); border-radius:14px;
    padding:16px 18px; margin-bottom:10px; cursor:pointer; font-family:inherit;
  }
  .menu-list-icon{
    width:38px; height:38px; border-radius:10px; background:rgba(201,153,59,0.15);
    color:var(--pine-dark); display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .menu-list-icon svg{ width:19px; height:19px; }
  .menu-list-title{ font-size:15px; font-weight:600; color:var(--ink-on-paper); }
  .menu-list-sub{ font-size:12.5px; color:var(--ink-on-paper); opacity:0.6; }
  .menu-back-btn{
    display:inline-flex; align-items:center; gap:6px; background:none; border:none;
    color:var(--paper); font-weight:600; font-size:14px; cursor:pointer; padding:0; margin-bottom:16px; font-family:inherit; opacity:0.9;
  }

  /* ====== PROGRESS-FOTOS ====== */
  .progress-type-row{ display:flex; gap:8px; margin:16px 0; }
  .progress-type-btn{
    flex:1; padding:12px 6px; border-radius:12px; border:1.5px solid var(--line);
    background:#fff; color:var(--input-ink); font-size:13px; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .progress-type-btn.active{ background:var(--pine); border-color:var(--pine); color:#fff; }
  .progress-photo-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-top:18px; }
  .progress-photo-item{ position:relative; border-radius:12px; overflow:hidden; aspect-ratio:3/4; background:var(--cream); }
  .progress-photo-item img{ width:100%; height:100%; object-fit:cover; display:block; }
  .progress-photo-badge{
    position:absolute; top:6px; left:6px; background:rgba(0,0,0,0.6); color:#fff;
    font-size:9.5px; font-weight:700; text-transform:uppercase; padding:2px 7px; border-radius:8px;
  }
  .progress-photo-date{
    position:absolute; bottom:0; left:0; right:0; background:rgba(0,0,0,0.55); color:#fff;
    font-size:10px; padding:3px 6px; text-align:center;
  }
  .progress-photo-delete{
    position:absolute; top:4px; right:4px; width:22px; height:22px; border-radius:50%;
    background:rgba(0,0,0,0.55); color:#fff; border:none; font-size:12px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }

  /* ====== TÄGLICHER FITNESS-MYTHOS ====== */
  .myth-card{
    border-radius:18px; padding:20px 22px; margin-bottom:18px;
    background:var(--card-bg); border:1px solid var(--line); box-shadow:var(--shadow);
  }
  .myth-eyebrow{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; font-weight:700; color:var(--terracotta); margin:0 0 12px; }
  .myth-row{ display:flex; align-items:flex-start; gap:10px; margin-bottom:12px; }
  .myth-row:last-child{ margin-bottom:0; }
  .myth-icon{ flex-shrink:0; width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; margin-top:1px; }
  .myth-icon.is-false{ background:var(--terracotta-soft); color:var(--terracotta); }
  .myth-icon.is-true{ background:rgba(201,153,59,0.18); color:var(--pine-dark); }
  .myth-text{ font-size:14px; line-height:1.55; color:var(--ink-on-paper); }
  .myth-text strong{ color:var(--ink-on-paper); }

  /* ====== 21-TAGE-CHALLENGE ====== */
  .challenge-hero{
    position:relative; overflow:hidden; border-radius:20px; padding:22px 22px 24px;
    margin-bottom:18px; background:linear-gradient(135deg, var(--pine) 0%, var(--terracotta) 100%);
    box-shadow:var(--shadow); color:#fff;
  }
  .challenge-hero::before{
    content:""; position:absolute; top:-40px; right:-40px; width:140px; height:140px;
    border-radius:50%; background:rgba(255,255,255,0.12);
  }
  .challenge-hero-eyebrow{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; font-weight:700; opacity:0.9; margin:0 0 6px; }
  .challenge-hero h3{ font-family:Georgia,serif; font-size:21px; margin:0 0 8px; color:#fff; }
  .challenge-hero p{ font-size:13.5px; line-height:1.5; opacity:0.95; margin:0 0 16px; max-width:340px; }
  .challenge-progress-row{ display:flex; align-items:center; gap:14px; }
  .challenge-ring{
    position:relative; width:58px; height:58px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:conic-gradient(#fff calc(var(--pct) * 1%), rgba(255,255,255,0.28) 0);
  }
  .challenge-ring-inner{
    width:46px; height:46px; border-radius:50%; background:var(--pine);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:Georgia,serif; font-weight:700; font-size:13px; color:#fff; line-height:1.1;
  }
  .challenge-hero-btn{
    background:#fff; color:var(--pine-dark); border:none; padding:12px 20px; border-radius:12px;
    font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; white-space:nowrap;
  }
  .challenge-day-grid{
    display:grid; grid-template-columns:repeat(7, 1fr); gap:8px; margin:18px 0;
  }
  .challenge-day{
    aspect-ratio:1; border-radius:14px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px; cursor:pointer; border:1.5px solid var(--line); background:var(--card-bg); position:relative;
    transition:transform .15s ease;
  }
  .challenge-day:active{ transform:scale(0.94); }
  .challenge-day-num{ font-size:10px; font-weight:700; color:var(--ink-on-paper); opacity:0.55; }
  .challenge-day-icon{ font-size:17px; }
  .challenge-day.is-today{ border-color:var(--pine); border-width:2px; }
  .challenge-day.is-done{ background:var(--pine); }
  .challenge-day.is-done .challenge-day-num{ color:#fff; opacity:0.85; }
  .challenge-day.is-rest{ background:var(--cream); }
  .challenge-day-check{
    position:absolute; top:-5px; right:-5px; width:18px; height:18px; border-radius:50%;
    background:var(--terracotta); color:#fff; font-size:10px; display:flex; align-items:center; justify-content:center;
    font-weight:700; box-shadow:0 1px 4px rgba(0,0,0,0.2);
  }
  .challenge-legend{ display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--ink-on-paper); opacity:0.75; margin-bottom:16px; }
  .challenge-legend span{ display:inline-flex; align-items:center; gap:5px; }
  .challenge-today-card{
    background:var(--accent-box-bg); border-radius:16px; padding:18px 20px; color:var(--paper); margin-bottom:6px;
  }
  .challenge-today-card h4{ color:var(--pine); font-size:12px; text-transform:uppercase; letter-spacing:.05em; margin:0 0 8px; }
  .challenge-today-card p{ font-size:14.5px; margin:0 0 14px; opacity:0.95; line-height:1.5; }

  /* ====== TRAINING (Video-Datenbank) ====== */
  .training-intro{
    background:var(--accent-box-bg); border-radius:18px; padding:20px 22px;
    margin-bottom:18px; border:1px solid var(--line);
  }
  .training-intro h3{ color:var(--paper); font-family:Georgia,serif; font-size:19px; margin:0 0 6px; }
  .training-intro p{ color:var(--ink); opacity:0.8; font-size:13.5px; margin:0; line-height:1.5; }
  .rise-section-title{
    font-size:12.5px; text-transform:uppercase; letter-spacing:.05em;
    color:var(--terracotta); margin:0 0 10px; font-weight:700;
  }
  .rise-workout-card{
    background:var(--card-bg); border-radius:14px; padding:14px 16px; border:1px solid var(--line);
    margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
  }
  .rise-workout-info{ display:flex; flex-direction:column; gap:2px; flex:1; min-width:150px; }
  .rise-workout-info a{ color:var(--ink-on-paper); font-size:14.5px; font-weight:600; text-decoration:none; }
  .rise-workout-info a:hover{ color:var(--pine-dark); text-decoration:underline; }
  .rise-workout-info span{ color:var(--ink-on-paper); opacity:0.6; font-size:12px; }
  .rise-workout-done-btn{
    background:var(--pine); color:#fff; border:none; padding:8px 14px; border-radius:10px;
    font-size:12.5px; font-weight:600; cursor:pointer; font-family:inherit; white-space:nowrap;
  }
  .rise-workout-done-btn:hover{ background:var(--pine-dark); }
  .rise-workout-done-btn.done{ background:var(--terracotta-soft); color:var(--pine-dark); cursor:default; }

  /* ====== WORKOUT PHOTO-KARTEN (Jump & Lift / Bounce & Flow etc.) ====== */
  .workout-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(105px,1fr));
    gap:10px; margin-bottom:22px;
  }
  .workout-card{
    position:relative; border-radius:16px; overflow:hidden; aspect-ratio:3/4;
    cursor:pointer; box-shadow:var(--shadow); border:1px solid var(--line);
    background:var(--accent-box-bg); transition:transform .18s cubic-bezier(.22,1,.36,1);
  }
  .workout-card:active{ transform:scale(0.97); }
  .workout-card img{ width:100%; height:100%; object-fit:cover; display:block; }
  .workout-card-noimg{
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, var(--pine) 0%, var(--terracotta) 100%);
    color:#fff; font-size:15px; font-weight:700; text-align:center; padding:16px;
    font-family:Georgia,serif;
  }
  .workout-card-overlay{
    position:absolute; inset:0; display:flex; flex-direction:column; justify-content:flex-end;
    padding:10px; background:linear-gradient(to top, rgba(0,0,0,0.78) 0%, rgba(0,0,0,0.25) 50%, rgba(0,0,0,0) 70%);
    pointer-events:none;
  }
  .workout-card-title{ color:#fff; font-family:Georgia,serif; font-size:13px; font-weight:700; margin:0 0 2px; line-height:1.2; }
  .workout-card-meta{ color:rgba(255,255,255,0.85); font-size:9.5px; font-weight:600; letter-spacing:.02em; }
  .workout-card-done-badge{
    position:absolute; top:10px; right:10px; background:var(--pine); color:#fff;
    width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:13px; box-shadow:0 2px 6px rgba(0,0,0,0.3); font-weight:700;
  }

  /* ====== WORKOUT-SLIDER (swipebar, mit Punkten) ====== */
  .workout-slider-wrap{ margin-bottom:22px; }
  .workout-slider{
    display:flex; overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch;
    scrollbar-width:none; -ms-overflow-style:none; margin:0 -18px; padding:0 18px;
  }
  .workout-slider::-webkit-scrollbar{ display:none; }
  .workout-slide{
    scroll-snap-align:start; flex:0 0 100%; max-width:100%; padding-right:0; cursor:pointer;
  }
  .workout-slide-photo{
    position:relative; width:100%; aspect-ratio:4/3; border-radius:20px; overflow:hidden;
    box-shadow:var(--shadow); border:1px solid var(--line);
    background:linear-gradient(135deg, var(--pine) 0%, var(--terracotta) 100%);
  }
  .workout-slide-photo img{ width:100%; height:100%; object-fit:cover; display:block; }
  .workout-slide-noimg{ width:100%; height:100%; }
  .workout-slide-new-badge{
    position:absolute; top:14px; right:14px; background:var(--pine); color:#fff;
    font-size:11px; font-weight:800; letter-spacing:.04em; padding:7px 15px; border-radius:20px;
    box-shadow:0 3px 8px rgba(0,0,0,0.28); text-transform:uppercase;
  }
  .workout-slide-info{ padding:14px 4px 0; }
  .workout-slide-title{ font-family:Georgia,serif; font-size:20px; color:var(--paper); margin:0 0 7px; font-weight:700; }
  .workout-slide-meta-row{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; color:var(--paper); opacity:0.85; font-size:13.5px; }
  .slider-dots{ display:flex; justify-content:center; gap:6px; margin-top:16px; }
  .slider-dot{ width:8px; height:8px; border-radius:50%; background:var(--line); cursor:pointer; transition:all .2s ease; border:none; padding:0; }
  .slider-dot.active{ background:var(--pine); width:22px; border-radius:5px; }

  /* ====== WORKOUT-SUCHER (Zeitfilter) ====== */
  .workout-time-filter{ display:flex; gap:7px; flex-wrap:wrap; margin:14px 0 18px; }
  .time-filter-chip{
    padding:9px 15px; border-radius:20px; font-size:12.5px; cursor:pointer;
    border:1.5px solid rgba(255,255,255,0.3); background:rgba(255,255,255,0.15);
    color:var(--ink); font-weight:600; white-space:nowrap; transition:all .18s cubic-bezier(.22,1,.36,1);
  }
  .time-filter-chip.active{ background:var(--pine); border-color:var(--pine); color:#fff; }
  .workout-empty-note{ color:var(--paper); opacity:0.7; font-size:13.5px; padding:14px 2px; margin:0 0 12px; }

  /* ====== LYMPH TIMER ====== */
  .lymph-modal{ text-align:center; padding-top:56px; }
  .lymph-eyebrow{ color:var(--terracotta); font-size:12px; text-transform:uppercase; letter-spacing:.06em; font-weight:700; margin:0 0 8px; }
  .lymph-exercise-name{ margin:0 0 8px; }
  .lymph-cue{ color:var(--ink-on-paper); opacity:0.7; font-size:14px; margin:0 0 26px; line-height:1.5; }
  .lymph-video{ width:auto; max-width:100%; height:auto; max-height:min(46vh,420px); border-radius:16px; margin:0 auto 18px; display:block; box-shadow:var(--shadow); object-fit:contain; }
  .lymph-countdown{ font-size:58px; font-weight:700; font-family:Georgia,serif; color:var(--pine-dark); margin-bottom:20px; }
  .lymph-next{ color:var(--ink-on-paper); opacity:0.55; font-size:13px; margin:0 0 22px; }
  .lymph-controls{ display:flex; gap:10px; justify-content:center; }
  .lymph-finish-icon{ font-size:46px; margin-bottom:10px; }
  .lymph-progress-track{ background:rgba(212,175,55,0.14); border-radius:20px; height:8px; overflow:hidden; margin-bottom:22px; }
  .lymph-progress-fill{ background:var(--pine); height:100%; border-radius:20px; transition:width .4s ease; }

function t(key){
  return (translations[currentLang] && translations[currentLang][key])

async function setLanguage(lang){
  if(!translations[lang] || lang === currentLang) return;
  currentLang = lang;
  localStorage.setItem("vs_lang", lang);
  document.documentElement.setAttribute("lang", lang);

  if(state.user){
    const { error } = await sb.from("user_settings").upsert({
      user_id: state.user.id,
      preferred_lang: lang,
      updated_at: new Date().toISOString()
    });
    if(error) console.error("Sprachpräferenz konnte nicht gespeichert werden:", error);
  }
  render();
}

async function loadProgressPhotos(){
  if(!state.user) return;
  const { data, error } = await sb.from("progress_photos")
    .select("*").eq("user_id", state.user.id)
    .order("taken_at", { ascending: false });
  if(error){ console.error(error); return; }
  const rows = data || [];
  if(rows.length > 0){
    const paths = rows.map(r => r.storage_path);
    const { data: signedData, error: signedError } = await sb.storage
      .from("progress-photos").createSignedUrls(paths, 3600);
    if(!signedError && signedData){
      rows.forEach(r => {
        const match = signedData.find(s => s.path === r.storage_path);
        r.signed_url = match ? match.signedUrl : null;
      });
    }
  }
  state.progressPhotos = rows;
  render();
}

async function uploadProgressPhoto(file, type){
  if(!state.user) return;
  state.progressPhotoUploading = true;
  render();
  try{
    const compressed = await compressImageFile(file, 1400, 0.8);
    const fileName = `${state.user.id}/${Date.now()}-${type}.jpg`;
    const { error: uploadError } = await sb.storage
      .from("progress-photos")
      .upload(fileName, compressed, { contentType: "image/jpeg", upsert: false });
    if(uploadError) throw uploadError;
    const { error: insertError } = await sb.from("progress_photos")
      .insert({ user_id: state.user.id, storage_path: fileName, photo_type: type, taken_at: new Date().toISOString().slice(0,10) });
    if(insertError) throw insertError;
    await loadProgressPhotos();
  }catch(err){
    alert("Fehler: " + err.message);
  }
  state.progressPhotoUploading = false;
  render();
}

async function deleteProgressPhoto(id, storagePath){
  if(!confirm(currentLang==='hu' ? 'Biztosan törlöd ezt a fotót?' : 'Dieses Foto wirklich löschen?')) return;
  await sb.storage.from("progress-photos").remove([storagePath]);
  const { error } = await sb.from("progress_photos").delete().eq("id", id);
  if(error){ alert("Fehler: " + error.message); return; }
  await loadProgressPhotos();
}

async function loadUserLanguage(){
  if(!state.user) return;
  const { data, error } = await sb.from("user_settings")
    .select("preferred_lang, display_name")
    .eq("user_id", state.user.id)
    .single();
  if(!error && data){
    if(data.preferred_lang){
      currentLang = data.preferred_lang;
      localStorage.setItem("vs_lang", currentLang);
      document.documentElement.setAttribute("lang", currentLang);
    }
    if(data.display_name) state.userDisplayName = data.display_name;
  }
}

async function saveUserDisplayName(name){
  if(!state.user) return;
  const trimmed = (name || "").trim();
  const { error } = await sb.from("user_settings").upsert({
    user_id: state.user.id,
    display_name: trimmed || null,
    updated_at: new Date().toISOString()
  });
  if(error){ alert("Fehler: " + error.message); return; }
  state.userDisplayName = trimmed || null;
  state.editingName = false;
  render();
}

// Sucht sowohl im deutschen als auch im ungarischen Titel — unabhängig davon,
// in welcher Sprache die Person gerade tippt oder die App eingestellt ist.
function recipeMatchesSearch(recipe, query){
  if(!query) return true;
  const q = query.toLowerCase();
  const deMatch = recipe.title && recipe.title.toLowerCase().includes(q);
  const huMatch = recipe.title_hu && recipe.title_hu.toLowerCase().includes(q);
  return deMatch || huMatch;
}

function getRecipeTitle(recipe){
  if(currentLang === "hu" && recipe.title_hu) return recipe.title_hu;

function getMealOrderRank(recipe){
  if(!recipe || !recipe.tags) return MEAL_ORDER_TAGS.length;
  for(let i=0; i<MEAL_ORDER_TAGS.length; i++){
    if(recipe.tags.includes(MEAL_ORDER_TAGS[i])) return i;
  }
  return MEAL_ORDER_TAGS.length;
}

function getKcalBand(kcal, servings){
  if(kcal == null) return null;
  const perServing = servings ? kcal / servings : kcal;
  if(perServing < 150) return "100 kcal";
  if(perServing < 250) return "200 kcal";
  if(perServing < 350) return "300 kcal";
  return "400 kcal";
}

function getCurrentWeekDates(){
  const today = new Date();
  const dayOfWeek = today.getDay();
  const mondayOffset = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
  const monday = new Date(today);
  monday.setDate(today.getDate() + mondayOffset);
  const dates = [];
  for(let i = 0; i < 7; i++){
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    dates.push(d.toISOString().slice(0,10));
  }
  return dates;
}

function render(){
  const el = document.getElementById("app");
  if(state.view === "login" || state.view === "register"){
    document.body.style.background = "#0B0B0B";
  } else {
    document.body.style.background = "";
  }
  if(state.view === "loading"){
    el.innerHTML = `<div class="loading">${t("loading")}</div>`;
    return;
  }
  if(state.view === "login" || state.view === "register"){
    el.innerHTML = renderAuth();
    bindAuthEvents();
    return;
  }
  el.innerHTML = renderAppShell();
  bindAppEvents();
}

/* ---------- AUTH ---------- */
function renderAuth(){
  const isLogin = state.view === "login";
  const showClosedMessage = !isLogin && REGISTRATION_CLOSED;
  return `
    <div class="auth-wrap">
      <div class="auth-card">
        <img class="auth-logo" src="${LOGO_BASE64}" alt="Jumphoria">
        <h2>${isLogin ? "Willkommen zur\u00fcck" : "Konto erstellen"}</h2>
        <p class="auth-sub">${isLogin ? "Melde dich an, um deine Rezepte zu sehen." : "Lege dein kostenloses Jumphoria-Konto an."}</p>
        ${state.error && typeof state.error === "string" && state.error.length > 0 ? `<div class="auth-error">${state.error}</div>` : ""}
        ${state.serviceDown ? `<div class="auth-error">&#9888;&#65039; Dienst momentan nicht erreichbar. Bitte in ein paar Minuten erneut versuchen.</div>` : ""}
        ${showClosedMessage ? `
          <div class="auth-closed-notice">
            \u{1F512} Die Registrierung ist aktuell geschlossen. Jumphoria befindet sich noch in der Testphase und ist noch nicht öffentlich zugänglich. Schau bald wieder vorbei!
          </div>
          <div class="auth-toggle">
            Schon registriert? <a id="to-login">Zum Login</a>
          </div>
        ` : `
        <form id="auth-form">
          <div class="field"><label>E-Mail</label><input type="email" id="auth-email" required placeholder="du@beispiel.de"></div>
          <div class="field"><label>Passwort</label><input type="password" id="auth-password" required placeholder="Mindestens 6 Zeichen" minlength="6"></div>
          <button type="submit" class="btn btn-block">${isLogin ? "Anmelden" : "Registrieren"}</button>
        </form>
        <div class="auth-toggle">
          ${isLogin ? `Noch kein Konto? <a id="to-register">Jetzt registrieren</a>` : `Schon registriert? <a id="to-login">Zum Login</a>`}
        </div>
        `}
      </div>
    </div>`;
}

function bindAuthEvents(){
  const authForm = document.getElementById("auth-form");
  if(authForm) authForm.addEventListener("submit", async (e)=>{
    e.preventDefault();
    state.error = "";
    const email = document.getElementById("auth-email").value.trim();
    const password = document.getElementById("auth-password").value;
    const submitBtn = e.target.querySelector("button");
    submitBtn.disabled = true; submitBtn.textContent = "Einen Moment \u2026";
    try{
      if(state.view === "login"){
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if(error) throw error;
      } else {
        const { error } = await sb.auth.signUp({ email, password });
        if(error) throw error;
        alert("Konto erstellt! Falls eine Best\u00e4tigungsmail n\u00f6tig ist, pr\u00fcfe dein Postfach.");
        state.view = "login"; render(); return;
      }
      await checkSession();
    }catch(err){ state.error = translateError(err.message); render(); }
  });
  const toReg = document.getElementById("to-register");
  if(toReg) toReg.addEventListener("click", ()=>{ state.view="register"; state.error=""; render(); });
  const toLogin = document.getElementById("to-login");
  if(toLogin) toLogin.addEventListener("click", ()=>{ state.view="login"; state.error=""; render(); });
}

function translateError(msg){
  if(!msg) return "Etwas ist schiefgelaufen.";
  if(msg.includes("Invalid login credentials")) return "E-Mail oder Passwort ist falsch.";
  if(msg.includes("already registered")) return "Diese E-Mail ist schon registriert.";
  if(msg.includes("Password")) return "Das Passwort muss mindestens 6 Zeichen haben.";
  return msg;
}

function renderIRGrid(list){
  if(list.length === 0){
    return `<div class="empty-state"><h3>${currentLang==='hu' ? 'Nincs találat' : 'Keine Rezepte gefunden'}</h3></div>`;
  }
  return `<div class="grid">${list.map(r => {
    const kcalPerServing = (r.kcal != null && r.servings) ? Math.round(r.kcal / r.servings) : null;
    const proteinPerServing = (r.protein != null && r.servings) ? Math.round(r.protein / r.servings) : null;
    const carbsPerServing = (r.carbs != null && r.servings) ? Math.round(r.carbs / r.servings) : null;
    const fatPerServing = (r.fat != null && r.servings) ? Math.round(r.fat / r.servings) : null;
    const hasMacros = proteinPerServing !== null || carbsPerServing !== null || fatPerServing !== null;
    return `<div class="card" data-id="${r.id}">
      <div class="card-hole"></div>
      ${r.photo_url ? `<img class="card-photo" src="${r.photo_url}" alt="${escapeAttr(getRecipeTitle(r))}">` : `<div class="card-photo empty">${NAV_ICONS.ir}</div>`}
      ${kcalPerServing !== null ? `<div class="kcal-badge">${kcalPerServing} kcal</div>` : ""}
      <div class="card-body">
        <h3 class="recipe-title">${escapeHtml(getRecipeTitle(r))}</h3>
        ${hasMacros ? `<div class="card-macro-row">
          ${proteinPerServing !== null ? `<span class="card-macro-chip">${t("eiweiss").slice(0,1)} ${proteinPerServing}g</span>` : ""}
          ${carbsPerServing !== null ? `<span class="card-macro-chip">${t("kh")} ${carbsPerServing}g</span>` : ""}
          ${fatPerServing !== null ? `<span class="card-macro-chip">${t("fett").slice(0,1)} ${fatPerServing}g</span>` : ""}
        </div>` : ""}
        <button type="button" class="today-add-btn" data-recipe-id="${r.id}">+ ${t("geplant")}</button>
      </div>
    </div>`;
  }).join("")}</div>`;
}

// Leitet einen Vornamen aus der E-Mail-Adresse ab (vor dem @, Ziffern/Punkte entfernt),
// für die Begrüßung auf der Startansicht.
function getUserFirstName(){
  if(state.userDisplayName) return state.userDisplayName;
  const email = state.user?.email || "";
  const localPart = email.split("@")[0] || "";
  const cleaned = localPart.replace(/[0-9._-]+$/g, "").split(/[._-]/)[0] || localPart;
  if(!cleaned) return "";
  return cleaned.charAt(0).toUpperCase() + cleaned.slice(1).toLowerCase();
}

function renderTodayNutriCard(){
  const isHu = currentLang === 'hu';
  calcProfil();
  const todayStr = new Date().toISOString().slice(0,10);
  const entries = (state.weekLog || []).filter(e => e.log_date === todayStr && e.eaten);
  let kcalSum=0, proteinSum=0, carbsSum=0, fatSum=0;
  entries.forEach(e => {
    const recipe = state.recipes.find(r => r.id === e.recipe_id);
    if(!recipe) return;
    const factor = e.servings_logged / (recipe.servings || 1);
    if(recipe.kcal != null) kcalSum += recipe.kcal * factor;
    if(recipe.protein != null) proteinSum += recipe.protein * factor;
    if(recipe.carbs != null) carbsSum += recipe.carbs * factor;
    if(recipe.fat != null) fatSum += recipe.fat * factor;
  });
  const todayExtras = (state.weekExtras || []).filter(x => x.log_date === todayStr);
  todayExtras.forEach(x => {
    kcalSum += Number(x.kcal) || 0;
    proteinSum += Number(x.protein) || 0;
    carbsSum += Number(x.carbs) || 0;
    fatSum += Number(x.fat) || 0;
  });
  kcalSum = Math.round(kcalSum); proteinSum = Math.round(proteinSum); carbsSum = Math.round(carbsSum); fatSum = Math.round(fatSum);

  if(!state.profilKcal){
    return `<div class="today-nutri-card">
      <h4 class="today-nutri-title">${isHu ? 'Mai áttekintés' : 'Heutige Übersicht'}</h4>
      <p class="today-nutri-sub" style="margin-bottom:0;">${isHu ? `Eddig ma: ${kcalSum} kcal. Töltsd ki a Profilt a napi célhoz és a hátralévő kalóriák kiszámításához.` : `Bisher heute: ${kcalSum} kcal. Fülle dein Profil aus, um dein Tagesziel und die verbleibenden Kalorien zu sehen.`}</p>
    </div>`;
  }

  const targetKcal = state.profilKcal;
  const targetMakros = state.profilMakros || { protein:0, carbs:0, fat:0 };
  const remaining = targetKcal - kcalSum;
  const pctEaten = Math.max(0, Math.min(100, Math.round((kcalSum / targetKcal) * 100)));

  function macroBar(label, eaten, target){
    const pct = target > 0 ? Math.min(100, Math.round((eaten/target)*100)) : 0;
    const over = eaten > target;
    return `<div class="today-macro-item">
      <div class="today-macro-label"><b>${label}</b><span>${eaten} / ${target} g</span></div>
      <div class="today-macro-track"><div class="today-macro-fill ${over ? 'is-over' : ''}" style="width:${pct}%;"></div></div>
    </div>`;
  }

  return `<div class="today-nutri-card">
    <h4 class="today-nutri-title">${isHu ? 'Mai áttekintés' : 'Heutige Übersicht'}</h4>
    <p class="today-nutri-sub">${isHu ? 'Napi cél' : 'Tagesziel'}: ${targetKcal} kcal \u00b7 ${isHu ? 'csak a bejelölt étkezések számítanak bele' : 'nur als gegessen markierte Mahlzeiten zählen'}</p>
    <div class="today-nutri-row">
      <div class="today-nutri-side"><strong>${kcalSum}</strong><span>${isHu ? 'Elfogyasztva' : 'Gegessen'}</span></div>
      <div class="today-nutri-ring" style="--pct:${pctEaten}; background:conic-gradient(${remaining < 0 ? 'var(--terracotta)' : 'var(--pine)'} calc(var(--pct)*1%), rgba(212,175,55,0.14) 0);">
        <div class="today-nutri-ring-inner">
          <strong>${remaining < 0 ? '+' + Math.abs(remaining) : remaining}</strong>
          <span>${remaining < 0 ? (isHu ? 'túllépve' : 'über Ziel') : (isHu ? 'marad' : 'übrig')}</span>
        </div>
      </div>
    </div>
    ${macroBar(isHu ? 'Szénhidrát' : 'Kohlenhydrate', carbsSum, targetMakros.carbs)}
    ${macroBar(isHu ? 'Fehérje' : 'Eiweiß', proteinSum, targetMakros.protein)}
    ${macroBar(isHu ? 'Zsír' : 'Fett', fatSum, targetMakros.fat)}
  </div>`;
}

function renderWeek(){
  const entries = state.weekLog || [];
  const weekDates = getCurrentWeekDates();
  const nutriCard = renderTodayNutriCard();
  const header = `
    <div style="margin-bottom:16px; display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
      <button type="button" class="btn" id="auto-week-btn" style="flex:1; min-width:180px;">&#x2728; Woche automatisch planen</button>
      ${entries.length > 0 ? `<button type="button" class="btn-danger" id="clear-week-btn">Woche leeren</button>` : ''}
    </div>`;
  if(entries.length === 0){
    return nutriCard + header + `<div class="empty-state"><h3>Noch nichts für diese Woche geplant</h3><p>Tippe auf "Woche automatisch planen" oder geh zu "Rezepte" und tippe bei einem Rezept auf "+ Geplant".</p></div>`;
  }
  const todayStrForOrder = new Date().toISOString().slice(0,10);
  const todayIdxForOrder = weekDates.indexOf(todayStrForOrder);
  const orderedDayIndices = todayIdxForOrder >= 0
    ? Array.from({length:7}, (_, i) => (todayIdxForOrder + i) % 7)
    : Array.from({length:7}, (_, i) => i);
  return nutriCard + header + `<div class="week-list">${orderedDayIndices.map(idx => {
    const date = weekDates[idx];
    const dayEntries = entries.filter(e => e.log_date === date);
    let kcalSum=0, proteinSum=0, carbsSum=0, fatSum=0;
    dayEntries.forEach(e => {
      const recipe = state.recipes.find(r => r.id === e.recipe_id);
      if(!recipe) return;
      const factor = e.servings_logged / (recipe.servings || 1);
      if(recipe.kcal != null) kcalSum += recipe.kcal * factor;
      if(recipe.protein != null) proteinSum += recipe.protein * factor;
      if(recipe.carbs != null) carbsSum += recipe.carbs * factor;
      if(recipe.fat != null) fatSum += recipe.fat * factor;
    });
    const dayExtras = (state.weekExtras || []).filter(x => x.log_date === date);
    dayExtras.forEach(x => {
      kcalSum += Number(x.kcal) || 0;
      proteinSum += Number(x.protein) || 0;
      carbsSum += Number(x.carbs) || 0;
      fatSum += Number(x.fat) || 0;
    });
    const dateObj = new Date(date + "T00:00:00");
    const dayLabel = WEEKDAY_NAMES[idx] + ", " + dateObj.getDate() + "." + (dateObj.getMonth()+1) + ".";
    const isToday = date === new Date().toISOString().slice(0,10);
    return `
      <div class="week-day ${isToday?'is-today':''}">
        <div class="week-day-header">
          <h4>${dayLabel}${isToday?' \u2022 heute':''}</h4>
          <div style="display:flex; align-items:center; gap:8px;">
            ${(dayEntries.length > 0 || dayExtras.length > 0) ? `<div class="week-day-macros"><span class="week-day-kcal">${Math.round(kcalSum)} kcal</span><span class="week-day-macro-detail">E ${Math.round(proteinSum)}g \u00b7 KH ${Math.round(carbsSum)}g \u00b7 F ${Math.round(fatSum)}g</span></div>` : ""}
            <button type="button" class="btn-outline day-add-btn" data-date="${date}" style="font-size:12px; padding:5px 10px; white-space:nowrap;">+ Rezept</button>
            <button type="button" class="btn-outline side-add-btn" data-date="${date}" style="font-size:12px; padding:5px 10px; white-space:nowrap;">+ ${currentLang==='hu' ? 'Kiegészítés' : 'Extra'}</button>
          </div>
        </div>
        ${(dayEntries.length === 0 && dayExtras.length === 0) ? `<p class="week-day-empty">Nichts geplant</p>` : `
          <div class="today-list">
            ${(() => {
              const sortedEntries = [...dayEntries].sort((a,b) => {
                const rankA = getMealOrderRank(state.recipes.find(r => r.id === a.recipe_id));
                const rankB = getMealOrderRank(state.recipes.find(r => r.id === b.recipe_id));
                return rankA - rankB;
              });
              let lastRank = -1;
              return sortedEntries.map(e => {

              if(!recipe) return "";
              const rank = getMealOrderRank(recipe);

                lastRank = rank;
              }

              const kcalForEntry = recipe.kcal != null ? Math.round(recipe.kcal * factor) : null;
              const isBatchEntry = (recipe.servings || 1) > 1;
              return sectionLabelHtml + `<div class="today-entry">
                <div class="today-entry-info today-entry-clickable" data-recipe-id="${recipe.id}">
                  <strong>${escapeHtml(getRecipeTitle(recipe))}</strong>
                  <span>${e.servings_logged} Portion${e.servings_logged==1?'':'en'}${kcalForEntry!==null?` \u00b7 ${kcalForEntry} kcal${isBatchEntry?'/Portion':''}`:''}</span>
                </div>
                ${isToday ? `<button type="button" class="today-eaten-toggle ${e.eaten?'is-eaten':''}" data-log-id="${e.id}" data-eaten="${e.eaten}" title="${currentLang==='hu' ? 'Megettem' : 'Gegessen'}">\u2713</button>` : ""}

                  <button type="button" class="stepper-btn today-qty-minus" data-log-id="${e.id}" data-current="${e.servings_logged}" title="Weniger Portionen">\u2212</button>
                  <span class="today-qty-value">${e.servings_logged}</span>

                </div>
                <button type="button" class="today-swap" data-log-id="${e.id}" data-recipe-id="${recipe.id}" title="Rezept tauschen">\u{1F504}</button>
                <button type="button" class="today-remove" data-log-id="${e.id}">\u2715</button>
              </div>`;
              }).join("");
            })()}
            ${dayExtras.length > 0 ? `<div class="meal-section-label">${currentLang==='hu' ? 'Köret' : 'Beilage'}</div>` : ""}
            ${dayExtras.map(x => {
              const side = findQuickExtraItem(x.side_key);
              const name = side ? quickSideName(side) : x.side_key;
              return `<div class="side-extra-entry">
                <span><strong>${escapeHtml(name)}</strong> \u00b7 ${x.amount_g}${quickExtraUnit(side)} \u00b7 ${Math.round(x.kcal)} kcal${quickSideCookedHint(side, x.amount_g)}</span>
                <button type="button" class="today-remove extra-remove" data-extra-id="${x.id}">\u2715</button>
              </div>`;
            }).join("")}
          </div>`}
      </div>`;
  }).join("")}</div>`;
}

async function loadShoppingItems(){
  const { data, error } = await sb.from("shopping_list_items").select("*").order("created_at", { ascending: true });
  if(error){ console.error(error); return; }
  state.shoppingItems = data || [];
  render();
}

async function addIngredientsToShoppingList(ingredientsStructured, factor){
  if(!ingredientsStructured || ingredientsStructured.length === 0) return;
  // Bestehende, noch nicht abgehakte Items laden, um Mengen zusammenzuführen statt Duplikate zu erzeugen
  const { data: existingItems, error: fetchError } = await sb.from("shopping_list_items").select("*").eq("checked", false);
  if(fetchError){ alert("Fehler: " + fetchError.message); return; }
  const existingMap = {};
  (existingItems||[]).forEach(it => { existingMap[(it.unit||"").toLowerCase()+"_"+it.name.toLowerCase()] = it; });

  for(const ing of ingredientsStructured){
    if(!ing.name) continue;
    const hasAmount = ing.amount !== null && ing.amount !== undefined;
    const amount = hasAmount ? ing.amount * factor : null;
    const unit = ing.unit || "";
    const key = unit.toLowerCase()+"_"+ing.name.toLowerCase();
    const match = existingMap[key];
    if(match){
      const newAmount = (match.amount || 0) + (amount || 0);
      const { error } = await sb.from("shopping_list_items").update({ amount: hasAmount ? newAmount : match.amount }).eq("id", match.id);
      if(error){ console.error(error); }
    } else {
      const { data: inserted, error } = await sb.from("shopping_list_items")
        .insert({ user_id: state.user.id, name: ing.name, unit, amount, checked: false })
        .select().single();
      if(error){ console.error(error); continue; }
      if(inserted) existingMap[key] = inserted;
    }
  }
  await loadShoppingItems();
}

function renderSwapPopup(){
  const { logId, recipeId } = state.swapTarget;
  const current = state.recipes.find(r => r.id === recipeId);
  if(!current) return "";
  // Kategorie bestimmen: gleiche Haupt-Tags (Frühstück/Hauptgericht/Snack/Dessert) wie das aktuelle Rezept
  const relevantTags = ['Frühstück','Hauptgericht','Snack','Dessert'];
  const currentCategory = relevantTags.find(t => (current.tags||[]).includes(t));
  const pool = state.recipes.filter(r =>
    r.id !== recipeId &&
    r.kcal != null &&
    (!currentCategory || (r.tags||[]).includes(currentCategory))
  );
  // Nach Kalorien-Nähe zum aktuellen Rezept sortieren, Top 6 als Alternativen anzeigen
  const currentKcalPerServing = current.kcal / (current.servings || 1);
  const alternatives = [...pool]
    .sort((a,b)=>{
      const aKcal = a.kcal/(a.servings||1), bKcal = b.kcal/(b.servings||1);
      return Math.abs(aKcal-currentKcalPerServing) - Math.abs(bKcal-currentKcalPerServing);
    })
    .slice(0, 6);
  return `<div class="overlay" id="swap-overlay"><div class="modal plan-modal">
    <button class="modal-close" id="swap-close">\u2715</button>
    <h2>\u{1F504} Rezept tauschen</h2>
    <p style="color:var(--ink-on-paper); opacity:0.75; font-size:14px; margin:0 0 4px;">Aktuell: <strong>${escapeHtml(getRecipeTitle(current))}</strong> (${Math.round(currentKcalPerServing)} kcal)</p>
    <p style="color:var(--ink-on-paper); opacity:0.6; font-size:13px; margin:0 0 14px;">Ähnliche Alternativen${currentCategory ? ` (${currentCategory})` : ''}:</p>
    <div class="picker-list">
      ${alternatives.map(r => {
        const kcalPerServing = Math.round(r.kcal/(r.servings||1));
        return `<button type="button" class="picker-item" data-swap-recipe-id="${r.id}"><span>${escapeHtml(getRecipeTitle(r))}</span><span class="picker-kcal">${kcalPerServing} kcal</span></button>`;
      }).join("")}
      ${alternatives.length === 0 ? `<p style="color:var(--ink-on-paper); opacity:0.6;">Keine passenden Alternativen gefunden.</p>` : ""}
    </div>
  </div></div>`;
}

function calcProfil(){
  const p = state.profil;
  if(!p.alter || !p.groesse || !p.gewicht) return;

  // Grundumsatz (Mifflin-St Jeor)
  let bmr;
  if(p.geschlecht === "w"){
    bmr = 10 * p.gewicht + 6.25 * p.groesse - 5 * p.alter - 161;
  } else {
    bmr = 10 * p.gewicht + 6.25 * p.groesse - 5 * p.alter + 5;
  }

  // Aktivitätsfaktor
  const faktoren = { "wenig": 1.2, "leicht": 1.375, "mittel": 1.55, "viel": 1.725 };
  const tdee = Math.round(bmr * (faktoren[p.aktivitaet] || 1.55));

  // Ziel-Anpassung
  let kcal = tdee;
  if(p.ziel === "abnehmen") kcal = Math.round(tdee * 0.85);
  else if(p.ziel === "halten") kcal = tdee;

  // Sicherheitsuntergrenze: nie unter den Grundumsatz (BMR) gehen,
  // da das langfristig ungesund ist (zu wenig Energie für Organfunktionen)
  const bmrRounded = Math.round(bmr);
  let kcalWasCapped = false;
  if(kcal < bmrRounded){ kcal = bmrRounded; kcalWasCapped = true; }

  // Makros nach Körpergewicht (statt fixer Prozente):
  // Eiweiß: 2,2 g/kg (oberer, sicherer Wert für Muskelerhalt im Kaloriendefizit)
  // Fett: 0,8 g/kg (Mittelwert aus 0,7-0,9 g/kg)
  // Kohlenhydrate: füllen die restlichen Kalorien auf
  const protein = Math.round(p.gewicht * 2.2);
  const fat = Math.round(p.gewicht * 0.8);
  const carbs = Math.max(40, Math.round((kcal - protein * 4 - fat * 9) / 4));

  state.profilKcal = kcal;
  state.profilMakros = { protein, carbs, fat };
  state.profilKcalCapped = kcalWasCapped;
  state.profilBmr = bmrRounded;
  localStorage.setItem("jumphoria_profil", JSON.stringify(p));
}

// Wählt für jeden Tag automatisch denselben Mythos für alle Nutzer:innen aus
// (Tag des Jahres modulo Anzahl der Mythen) — ändert sich jeden Tag von selbst.
function todaysFitnessMyth(){
  if(state.fitnessMyths.length === 0) return null;
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 0);
  const dayOfYear = Math.floor((now - start) / (1000*60*60*24));
  const index = dayOfYear % state.fitnessMyths.length;
  return state.fitnessMyths[index];
}

// Rundet die Lymphfluss-Gesamtdauer auf ganze Minuten, für den Zeitfilter-Vergleich (<=X Min)
function lymphDurationMinutesValue(){ return Math.round(lymphTotalSeconds() / 60); }
// true, wenn kein Zeitfilter aktiv ist oder das Workout in die gewählte Zeit passt
function matchesWorkoutTimeFilter(minutes){
  if(state.workoutTimeFilter == null) return true;
  return minutes <= state.workoutTimeFilter;
}

// Aktualisiert den aktiven Punkt beim Wischen, ohne render() aufzurufen (das würde die Scroll-Position stören).
// Klick auf einen Punkt springt sanft zum jeweiligen Slide.
function bindWorkoutSliderEvents(){
  const slider = document.getElementById("jumplift-slider");
  const dotsWrap = document.getElementById("jumplift-dots");
  if(!slider || !dotsWrap) return;
  const dots = dotsWrap.querySelectorAll(".slider-dot");
  if(dots.length === 0) return;

  function updateActiveDot(){
    const slideWidth = slider.clientWidth || 1;
    const index = Math.round(slider.scrollLeft / slideWidth);
    dots.forEach((d, i) => d.classList.toggle("active", i === index));
  }

  let scrollRaf = null;
  slider.addEventListener("scroll", ()=>{
    if(scrollRaf) return;
    scrollRaf = window.requestAnimationFrame(()=>{ updateActiveDot(); scrollRaf = null; });
  }, { passive: true });

  dots.forEach((dot, i) => {
    dot.addEventListener("click", ()=>{
      slider.scrollTo({ left: i * (slider.clientWidth || 0), behavior: "smooth" });
    });
  });
}

/* ---------- LYMPHFLUSS-TIMER ---------- */
let lymphTickerHandle = null;

function openLymphTimer(){
  clearInterval(lymphTickerHandle);
  state.lymphTimer = {
    open: true,
    stage: "intro",
    currentIndex: 0,
    secondsLeft: LYMPH_FLOW_EXERCISES[0].seconds,
    running: false,
    finished: false
  };
  render();
}

function startLymphSequence(){
  state.lymphTimer.stage = "running";
  state.lymphTimer.running = true;
  render();
  startLymphTicker();
}

function startLymphTicker(){
  clearInterval(lymphTickerHandle);
  lymphTickerHandle = setInterval(()=>{
    const t = state.lymphTimer;
    if(!t || !t.open || !t.running) return;
    t.secondsLeft -= 1;
    if(t.secondsLeft <= 0){
      advanceLymphExercise();
    } else {
      updateLymphTimerDOM();
    }
  }, 1000);
}

function updateLymphTimerDOM(){
  const t = state.lymphTimer;
  if(!t || !t.open || t.finished) return;
  const ex = LYMPH_FLOW_EXERCISES[t.currentIndex];
  const countdownEl = document.getElementById("lymph-countdown");
  const fillEl = document.getElementById("lymph-progress-fill");
  if(!countdownEl || !fillEl) return;
  const mins = Math.floor(t.secondsLeft / 60);
  const secs = t.secondsLeft % 60;
  countdownEl.textContent = `${mins}:${secs.toString().padStart(2,'0')}`;
  const progressPct = Math.round(((ex.seconds - t.secondsLeft) / ex.seconds) * 100);
  fillEl.style.width = progressPct + "%";
}

function advanceLymphExercise(){
  const t = state.lymphTimer;
  if(!t || !t.open) return;
  if(t.currentIndex < LYMPH_FLOW_EXERCISES.length - 1){
    t.currentIndex += 1;
    t.secondsLeft = LYMPH_FLOW_EXERCISES[t.currentIndex].seconds;
    render();
  } else {
    clearInterval(lymphTickerHandle);
    t.running = false;
    t.finished = true;
    render();
    completeWorkout(LYMPH_FLOW_WORKOUT_ID);
  }
}

function closeLymphTimer(){
  clearInterval(lymphTickerHandle);
  state.lymphTimer = { open: false, stage: "intro", currentIndex: 0, secondsLeft: 0, running: false, finished: false };
  render();
}

}

function startWalkTimer(minutes){
  clearInterval(walkTickerHandle);
  state.walkTimer = {
    open: true, stage: "running", durationMinutes: minutes,
    phase: "slow", phaseSecondsLeft: Math.min(WALK_PHASE_SECONDS, minutes*60),
    elapsedSeconds: 0, totalSeconds: minutes*60,
    running: true, finished: false
  };
  render();
  if(navigator.vibrate) navigator.vibrate([300,120,300,120,300]);
  playWalkTone();
  speakWalkCue("slow");
  startWalkTicker();
}

// ── Signale beim Tempo-Wechsel: Ton + gesprochene Ansage ──
function playWalkTone(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    const ctx = new Ctx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = "sine";
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
    osc.start();
    osc.stop(ctx.currentTime + 0.55);
  }catch(e){ /* Audio nicht verfügbar, ignorieren */ }
}

function speakWalkCue(phase){
  try{
    if(!window.speechSynthesis) return;
    const isHu = currentLang === "hu";
    const text = phase === "fast"
      ? (isHu ? "Gyorsabban!" : "Schneller!")
      : (isHu ? "Lassabban!" : "Langsamer!");
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = isHu ? "hu-HU" : "de-DE";
    utter.rate = 0.95;
    speechSynthesis.cancel(); // vorherige Ansage abbrechen, falls noch aktiv
    speechSynthesis.speak(utter);
  }catch(e){ /* Sprachausgabe nicht verfügbar, ignorieren */ }
}

function startWalkTicker(){
  clearInterval(walkTickerHandle);
  walkTickerHandle = setInterval(()=>{
    const t = state.walkTimer;
    if(!t || !t.open || !t.running) return;
    t.elapsedSeconds += 1;
    t.phaseSecondsLeft -= 1;
    if(t.elapsedSeconds >= t.totalSeconds){
      finishWalkTimer();
      return;
    }
    if(t.phaseSecondsLeft <= 0){
      t.phase = t.phase === "fast" ? "slow" : "fast";
      t.phaseSecondsLeft = Math.min(WALK_PHASE_SECONDS, t.totalSeconds - t.elapsedSeconds);
      if(navigator.vibrate) navigator.vibrate([300,120,300,120,300]);
      playWalkTone();
      speakWalkCue(t.phase);
      render();
    } else {
      updateWalkTimerDOM();
    }
  }, 1000);
}

function updateWalkTimerDOM(){
  const t = state.walkTimer;
  if(!t || !t.open || t.finished) return;
  const el = document.getElementById("walk-countdown");
  if(!el) return;
  const mins = Math.floor(t.phaseSecondsLeft / 60);
  const secs = t.phaseSecondsLeft % 60;
  el.textContent = `${mins}:${secs.toString().padStart(2,'0')}`;
  const totalEl = document.getElementById("walk-total-remaining");
  if(totalEl){
    const remain = t.totalSeconds - t.elapsedSeconds;
    const rMins = Math.floor(remain/60), rSecs = remain%60;
    totalEl.textContent = `${rMins}:${rSecs.toString().padStart(2,'0')}`;
  }
}

async function finishWalkTimer(){
  clearInterval(walkTickerHandle);
  const t = state.walkTimer;
  t.running = false;
  t.finished = true;
  render();
  if(state.user){
    const todayStr = new Date().toISOString().slice(0,10);
    const { error } = await sb.from("workout_log").insert({ user_id: state.user.id, workout_id: WALK_INTERVAL_WORKOUT_ID, log_date: todayStr, duration_minutes: t.durationMinutes });
    if(error){
      if(error.code !== "23505") console.error(error);
    } else {
      state.riseTodayWorkoutIds.push(WALK_INTERVAL_WORKOUT_ID);
    }
  }
  render();
}

function closeWalkTimer(){
  clearInterval(walkTickerHandle);
  state.walkTimer = { open: false, stage: "select", durationMinutes: 20, phase: "slow", phaseSecondsLeft: WALK_PHASE_SECONDS, elapsedSeconds: 0, totalSeconds: 0, running: false, finished: false };
  render();
}

// ── Automatische Gewichtsschätzung für gekochte Portionen ──
const STUECK_GEWICHTE = {
  "zwiebel": 80, "zehe": 5, "knoblauchzehe": 5, "ei": 60, "eiklar": 30,
  "tomate": 120, "paprika": 150, "zucchini": 200, "karotte": 80, "karotten": 80,
  "avocado": 150, "gurke": 300, "scheibe": 30, "dose": 150
};

// ── Kochfaktoren für Nudeln/Pasta (trocken → gekocht), nach Sorte ──
const NUDEL_KOCH_FAKTOREN = {
  "spätzle": 1.8,
  "eiernudeln": 2.2,
  "vollkornnudeln": 2.3,
  "spaghetti": 2.4,
  "nudeln": 2.4
};
function getNudelKochFaktor(name){
  const nameLower = (name || "").toLowerCase();
  for(const [key, faktor] of Object.entries(NUDEL_KOCH_FAKTOREN)){
    if(nameLower.includes(key)) return faktor;
  }
  return null;
}

function estimateCookedWeight(recipe, servings){
  if(!recipe.ingredients_structured || recipe.ingredients_structured.length === 0) return null;
  const scale = servings / (recipe.servings || 1);
  const steps = (recipe.steps || '').toLowerCase();

  // Kochverlust ermitteln
  const isFried = steps.includes('braten') || steps.includes('anbraten');
  const isBoiled = steps.includes('kochen') || steps.includes('köcheln');
  const isSoup = steps.includes('suppe') || steps.includes('wasser') || steps.includes('brühe');
  const hasRice = steps.includes('reis') || steps.includes('nudeln') || steps.includes('linsen');

  let totalRawGrams = 0;
  let liquidGrams = 0;

  recipe.ingredients_structured.forEach(ing => {
    if(!ing.name) return;
    const nameLower = ing.name.toLowerCase();

    // Gramm direkt
    if(ing.unit === 'g' && ing.amount){
      const g = ing.amount * scale;
      // Flüssigkeiten separat
      if(nameLower.includes('wasser') || nameLower.includes('milch') ||
         nameLower.includes('brühe') || nameLower.includes('tomaten') ||
         nameLower.includes('kokosmilch') || nameLower.includes('sauce')){
        liquidGrams += g;
      } else {
        totalRawGrams += g;
      }
    }
    // ml → g (ca. 1:1)
    else if(ing.unit === 'ml' && ing.amount){
      liquidGrams += ing.amount * scale;
    }
    // Stück-Angaben schätzen
    else if(!ing.unit && ing.amount){
      for(const [key, weight] of Object.entries(STUECK_GEWICHTE)){
        if(nameLower.includes(key)){
          totalRawGrams += ing.amount * weight * scale;
          break;
        }
      }
    }
    // TL/EL
    else if(ing.unit === 'TL' && ing.amount){ totalRawGrams += ing.amount * 5 * scale; }
    else if(ing.unit === 'EL' && ing.amount){ totalRawGrams += ing.amount * 15 * scale; }
  });

  // Kochverlust berechnen
  let cookedSolids = totalRawGrams;
  if(isFried) cookedSolids *= 0.80; // -20%
  else if(isBoiled) cookedSolids *= 0.90; // -10%
  if(hasRice) cookedSolids *= 2.5; // Reis/Linsen saugen Wasser auf

  // Flüssigkeit: -10% Reduktion
  const cookedLiquid = liquidGrams * (isSoup ? 0.92 : 0.50);

  const total = Math.round(cookedSolids + cookedLiquid);
  if(total < 50) return null;
  return total;
}

// Formatiert Portionsangaben mit halben Schritten (z.B. 1.5 -> "1½", 0.5 -> "½")
function formatServings(n){
  const whole = Math.floor(n);
  const frac = n - whole;
  if(Math.abs(frac) < 0.01) return String(whole);
  if(whole === 0) return "½";
  return whole + "½";
}

      const scaledAmount = ing.amount * scale;

      const unitStr = ing.unit ? ing.unit : '';
      const separator = ' ';

      // Bei Stück-Angaben (kein unit) Gramm-Schätzung aus STUECK_GEWICHTE ergänzen
      let gramHint = '';
      if(!ing.unit && ing.name){
        const nameLower = ing.name.toLowerCase();
        for(const [key, weight] of Object.entries(STUECK_GEWICHTE)){
          if(nameLower.includes(key)){
            const estGrams = Math.round(scaledAmount * weight);
            gramHint = ` <span class="ing-estimate">(~${estGrams}g)</span>`;

          }
        }

      if(ing.unit === 'g' && ing.name){
        const nudelFaktor = getNudelKochFaktor(ing.name);

  return `<div class="overlay" id="detail-overlay"><div class="modal">

    ${r.photo_url ? `<img class="detail-photo" src="${r.photo_url}" alt="${escapeAttr(getRecipeTitle(r))}">` : ""}

    ${r.kcal != null ? `<div class="macro-summary">
      <div class="macro-pill"><strong>${Math.round(r.kcal*scale)}</strong><span>kcal</span></div>
      ${r.protein != null ? `<div class="macro-pill"><strong>${Math.round(r.protein*scale)}g</strong><span>${t("eiweiss")}</span></div>` : ""}
      ${r.carbs != null ? `<div class="macro-pill"><strong>${Math.round(r.carbs*scale)}g</strong><span>${t("kh")}</span></div>` : ""}
      ${r.fat != null ? `<div class="macro-pill"><strong>${Math.round(r.fat*scale)}g</strong><span>${t("fett")}</span></div>` : ""}
      ${(() => { const w = estimateCookedWeight(r, currentServings); return w ? `<div class="macro-pill"><strong>~${w}g</strong><span>\u{1F963} ${t("gekocht")}</span></div>` : ""; })()}
    </div>` : ""}
    <div class="detail-section">
      <h4>${t("zutaten")}</h4>
      ${hasStructured ? `<button type="button" class="btn-outline shopping-add-btn" id="detail-add-shopping">\u{1F6D2} ${currentLang==='hu' ? 'Kiválasztottak a bevásárlólistához' : 'Ausgewählte zur Einkaufsliste'}</button>` : ""}
      <ul>${ingredientsHtml}</ul>
    </div>
    <div class="detail-section"><h4>${t("zubereitung")}</h4><p class="ztext">${escapeHtml(getRecipeSteps(r)||"")}</p></div>
    <div class="modal-actions">
      ${state.user && state.user.id === ADMIN_USER_ID ? `<button class="btn-outline" id="edit-from-detail">Bearbeiten</button>` : ""}
    </div>
  </div></div>`;
}

function bindAutoWeekEvents(){
  const overlay = document.getElementById("autoweek-overlay");
  if(!overlay) return;
  overlay.addEventListener("click", (e)=>{ if(e.target.id==="autoweek-overlay"){ state.autoWeekOpen=false; render(); } });
  document.getElementById("autoweek-close").addEventListener("click", ()=>{ state.autoWeekOpen=false; render(); });

  const gotoProfilBtn = document.getElementById("autoweek-goto-profil");
  if(gotoProfilBtn) gotoProfilBtn.addEventListener("click", ()=>{
    state.autoWeekOpen = false;
    state.mainTab = "profil";
    render();
  });

  const irOnlyCheckbox = document.getElementById("autoweek-ir-only");
  if(irOnlyCheckbox) irOnlyCheckbox.addEventListener("change", ()=>{
    state.autoWeekIROnly = irOnlyCheckbox.checked;
  });

  document.querySelectorAll("[data-kcal]").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const targetKcal = parseInt(btn.dataset.kcal);
      state.autoWeekOpen = false;
      btn.disabled = true;

      const weekDates = getCurrentWeekDates();
      const irOnly = state.autoWeekIROnly;
      const baseRecipePool = irOnly ? state.recipes.filter(r => (r.tags||[]).includes('IR')) : state.recipes;
      const allRecipes = baseRecipePool.filter(r => r.kcal != null && r.servings != null);
      if(allRecipes.length === 0){ alert(irOnly ? (currentLang==='hu' ? "Nincs elég IR-jelölt recept kalóriaadatokkal." : "Keine IR-Rezepte mit Kalorienangaben gefunden.") : "Keine Rezepte mit Kalorienangaben gefunden."); return; }

      // Fett-Zielwert aus dem Profil (falls vorhanden) – wird jetzt mit in die Auswahl einbezogen,
      // damit die Woche nicht strukturell zu fettarm wird, nur weil viele Rezepte kalorisch passen
      // aber wenig Fett enthalten (z.B. Magerquark-lastige Gerichte).
      const totalFatTarget = (state.profilMakros && state.profilMakros.fat) ? state.profilMakros.fat : null;

      // Kombinierter Abstand: relative Kalorien-Distanz + gewichtete relative Fett-Distanz.
      // Rezepte ohne Fettangabe werden nur nach Kalorien bewertet (kein Fett-Malus).
      // Berechnet, wie viele Portionen eines Rezepts nötig sind, um möglichst nah an das
      // Kalorienziel des Slots zu kommen (in 0,5er-Schritten, z.B. bei kleinen Snacks/Muffins
      // wie 41 kcal/Portion sonst massive Unterschätzung des Tagesziels).
      function computeServingsForTarget(recipe, kcalTarget){
        const perServing = recipe.kcal / (recipe.servings || 1);
        if(!perServing || perServing <= 0) return 1;
        let mult = kcalTarget / perServing;
        mult = Math.round(mult * 2) / 2;
        mult = Math.max(0.5, Math.min(4, mult));
        return mult;
      }

      function combinedScore(r, kcalTarget, fatTarget){
        const kcalPerServing = r.kcal / (r.servings || 1);
        const kcalScore = Math.abs(kcalPerServing - kcalTarget) / Math.max(kcalTarget, 1);
        if(fatTarget == null || r.fat == null) return kcalScore;
        const fatPerServing = r.fat / (r.servings || 1);
        const fatScore = Math.abs(fatPerServing - fatTarget) / Math.max(fatTarget, 1);
        return kcalScore + fatScore * 1.3; // Fett etwas stärker gewichtet, um dem Fettmangel gezielt entgegenzuwirken
      }

      // Kalorienbasierte (+ fettbewusste) Auswahl: pro Slot das Rezept wählen, dessen Makro-Profil
      // am nächsten am Slot-Ziel liegt (statt komplett zufällig).
      // Damit sich Rezepte über die Woche abwechseln, werden bereits
      // verwendete Rezepte erst nach Ausschöpfen des Pools wiederholt.
      function pickClosest(pool, kcalTarget, fatTarget, usedCounts){
        if(pool.length === 0) return null;
        // Sortiere nach: zuerst wie oft schon verwendet (weniger zuerst), dann kombinierter Distanz
        const sorted = [...pool].sort((a,b)=>{
          const usedA = usedCounts.get(a.id) || 0;
          const usedB = usedCounts.get(b.id) || 0;
          if(usedA !== usedB) return usedA - usedB;
          return combinedScore(a, kcalTarget, fatTarget) - combinedScore(b, kcalTarget, fatTarget);
        });
        // Unter den am wenigsten benutzten Rezepten: die 3 nächstliegenden nehmen und leicht zufällig wählen (Abwechslung)
        const leastUsed = usedCounts.get(sorted[0].id) || 0;
        const candidates = sorted.filter(r => (usedCounts.get(r.id)||0) === leastUsed)
          .sort((a,b)=>combinedScore(a, kcalTarget, fatTarget) - combinedScore(b, kcalTarget, fatTarget))
          .slice(0, 3);
        const chosen = candidates[Math.floor(Math.random()*candidates.length)];
        usedCounts.set(chosen.id, (usedCounts.get(chosen.id)||0) + 1);
        return chosen;
      }

      const fruehstueckPool = allRecipes.filter(r => (r.tags||[]).includes('Frühstück'));
      const snackPool = allRecipes.filter(r => (r.tags||[]).includes('Snack'));
      const hauptPool = allRecipes.filter(r => (r.tags||[]).includes('Hauptgericht'));
      const fallback = allRecipes;

      // Kalorienziel aufteilen: 25% Frühstück, 35% Mittag, 30% Abend, 10% Snack
      const kcalFrueh = Math.round(targetKcal * 0.25);
      const kcalMittag = Math.round(targetKcal * 0.35);
      const kcalAbend = Math.round(targetKcal * 0.30);
      // Fettziel im selben Verhältnis aufteilen (falls ein Profil-Fettziel vorhanden ist)
      const fatFrueh = totalFatTarget != null ? Math.round(totalFatTarget * 0.25) : null;
      const fatHauptAvg = totalFatTarget != null ? Math.round(totalFatTarget * 0.325) : null; // (35%+30%)/2
      const fatSnack = totalFatTarget != null ? Math.round(totalFatTarget * 0.10) : null;

      // Meal-Prep-Prinzip: mehrere Hauptgerichte für die GANZE Woche fix wählen.
      // 5 Gerichte auf 14 Mahlzeiten (7 Tage × Mittag+Abend) verteilt = max. 3 Wiederholungen pro Gericht,
      // und zwar in zusammenhängenden Blöcken (nicht zufällig zwischen den Tagen gemischt).
      const MAIN_DISH_COUNT = 5;
      const avgHauptTarget = Math.round((kcalMittag + kcalAbend) / 2);
      const hauptSourcePool = hauptPool.length ? hauptPool : fallback;
      const mainDishes = [...hauptSourcePool]
        .sort((a,b)=>combinedScore(a, avgHauptTarget, fatHauptAvg) - combinedScore(b, avgHauptTarget, fatHauptAvg))
        .slice(0, Math.min(MAIN_DISH_COUNT, hauptSourcePool.length));
      const totalMainSlots = weekDates.length * 2; // Mittag + Abend pro Tag
      function mainDishForSlot(slotIndex){
        if(mainDishes.length === 0) return null;
        const idx = Math.min(mainDishes.length - 1, Math.floor(slotIndex * mainDishes.length / totalMainSlots));
        return mainDishes[idx];
      }

      const usedFrueh = new Map();
      const usedSnack = new Map();

      const rows = [];
      weekDates.forEach((date, dayIndex) => {
        let tagesKcal = 0;

        const frueh = pickClosest(fruehstueckPool.length ? fruehstueckPool : fallback, kcalFrueh, fatFrueh, usedFrueh);
        if(frueh){
          const freuhServings = computeServingsForTarget(frueh, kcalFrueh);
          rows.push({ user_id: state.user.id, recipe_id: frueh.id, log_date: date, servings_logged: freuhServings });
          tagesKcal += (frueh.kcal / (frueh.servings || 1)) * freuhServings;
        }

        if(mainDishes.length > 0){
          const mittag = mainDishForSlot(dayIndex * 2);
          const mittagServings = computeServingsForTarget(mittag, kcalMittag);
          rows.push({ user_id: state.user.id, recipe_id: mittag.id, log_date: date, servings_logged: mittagServings });
          tagesKcal += (mittag.kcal / (mittag.servings || 1)) * mittagServings;

          const abend = mainDishForSlot(dayIndex * 2 + 1);
          const abendServings = computeServingsForTarget(abend, kcalAbend);
          rows.push({ user_id: state.user.id, recipe_id: abend.id, log_date: date, servings_logged: abendServings });
          tagesKcal += (abend.kcal / (abend.servings || 1)) * abendServings;
        }

        // Snack ergänzen, um die Lücke zum Tagesziel zu schließen
        const restKcal = targetKcal - tagesKcal;
        if(restKcal >= 50 && snackPool.length > 0){
          const snack = pickClosest(snackPool, restKcal, fatSnack, usedSnack);
          if(snack){
            const snackServings = computeServingsForTarget(snack, restKcal);
            rows.push({ user_id: state.user.id, recipe_id: snack.id, log_date: date, servings_logged: snackServings });
          }
        }
      });

      if(rows.length === 0){ alert("Keine passenden Rezepte gefunden."); return; }
      const { error } = await sb.from("daily_log").insert(rows);
      if(error){ alert("Fehler: " + error.message); return; }
      await loadWeekLog();
    });
  });
}

// Mischt ein Array zufällig (Fisher-Yates) — sorgt dafür, dass bei jedem App-Start
// eine andere Rezept-Reihenfolge angezeigt wird, statt immer dieselbe.
function shuffleArray(arr){
  const a = [...arr];
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

async function loadWeekLog(){
  const weekDates = getCurrentWeekDates();
  const { data, error } = await sb.from("daily_log")
    .select("*")
    .gte("log_date", weekDates[0])
    .lte("log_date", weekDates[6])
    .order("created_at", { ascending: true })
    .order("id", { ascending: true });
  if(error){ console.error(error); return; }
  state.weekLog = data || [];

  const { data: extrasData, error: extrasError } = await sb.from("daily_extras")
    .select("*")
    .gte("log_date", weekDates[0])
    .lte("log_date", weekDates[6])
    .order("created_at", { ascending: true });
  if(!extrasError) state.weekExtras = extrasData || [];

  // Vollständige Zutaten (ingredients_structured) für alle Rezepte in der Woche nachladen,
  // da state.recipes (Listenansicht) diese aus Performance-Gründen nicht enthält.
  const recipeIds = [...new Set(state.weekLog.map(e => e.recipe_id))];
  if(recipeIds.length > 0){
    const { data: detailData, error: detailError } = await sb.from("recipes")
      .select("id,servings,ingredients_structured,ingredients_structured_hu")
      .in("id", recipeIds);
    if(!detailError && detailData){
      const map = {};
      detailData.forEach(r => { map[r.id] = r; });
      state.weekRecipeDetails = map;
    }
  }
  render();
}
