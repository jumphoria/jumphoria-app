/* ---------- TRAINING: heute erledigte Workouts ---------- */
async function loadTodayWorkouts(){
  if(!state.user) return;
  const todayStr = new Date().toISOString().slice(0,10);
  const { data: workoutRows, error: workoutError } = await sb.from("workout_log")
    .select("workout_id").eq("user_id", state.user.id).eq("log_date", todayStr);
  if(!workoutError) state.riseTodayWorkoutIds = (workoutRows||[]).map(w => w.workout_id);
}

async function loadChallenge(){
  if(!state.user) return;
  const { data, error } = await sb.from("challenge_state").select("*").eq("user_id", state.user.id).maybeSingle();
  if(!error && data){
    state.challenge = { loaded: true, startDate: data.start_date, completedDays: data.completed_days || [], bonusAwarded: data.bonus_awarded };
  } else {
    state.challenge = { loaded: true, startDate: null, completedDays: [], bonusAwarded: false };
  }
}

function currentChallengeDayNumber(){
  if(!state.challenge.startDate) return null;
  const start = new Date(state.challenge.startDate + "T00:00:00");
  const today = new Date(); today.setHours(0,0,0,0);
  const diffDays = Math.floor((today - start) / (1000*60*60*24)) + 1;
  return Math.min(Math.max(diffDays, 1), CHALLENGE_LENGTH);
}

async function startChallengeNow(){
  if(!state.user) return;
  const todayStr = new Date().toISOString().slice(0,10);
  const { error } = await sb.from("challenge_state").upsert({ user_id: state.user.id, start_date: todayStr, completed_days: [], bonus_awarded: false, updated_at: new Date().toISOString() });
  if(error){ alert("Fehler: " + error.message); return; }
  state.challenge = { loaded: true, startDate: todayStr, completedDays: [], bonusAwarded: false };
  render();
}

async function toggleChallengeDay(dayNumber){
  if(!state.user) return;
  const isCompleted = state.challenge.completedDays.includes(dayNumber);
  let newCompleted;
  if(isCompleted){
    newCompleted = state.challenge.completedDays.filter(d => d !== dayNumber);
  } else {
    newCompleted = [...state.challenge.completedDays, dayNumber];
  }
  state.challenge.completedDays = newCompleted;
  render();

  const { error } = await sb.from("challenge_state").update({ completed_days: newCompleted, updated_at: new Date().toISOString() }).eq("user_id", state.user.id);
  if(error){ console.error(error); return; }

  if(!isCompleted && newCompleted.length >= CHALLENGE_LENGTH && !state.challenge.bonusAwarded){
    state.challenge.bonusAwarded = true;
    await sb.from("challenge_state").update({ bonus_awarded: true }).eq("user_id", state.user.id);
    render();
    alert(currentLang==='hu' ? '🎉 Gratulálunk, mind a 21 napot teljesítetted!' : '🎉 Herzlichen Glückwunsch, alle 21 Tage geschafft!');
  }
}

async function completeWorkout(workoutId){
  if(!state.user) return;
  const todayStr = new Date().toISOString().slice(0,10);
  const { error } = await sb.from("workout_log").insert({ user_id: state.user.id, workout_id: workoutId, log_date: todayStr });
  if(error){
    // Unique-Constraint-Verletzung = heute schon eingetragen, kein Fehler, einfach ignorieren
    if(error.code !== "23505") console.error(error);
    return;
  }
  state.riseTodayWorkoutIds.push(workoutId);
  render();
}

/* ==========================================================
   PERSONALISIERTE PORTIONSBERECHNUNG
   (nutzt den oben schon vorhandenen `sb`-Client)
   ========================================================== */

async function loadNutrients(ingredientNames){
  const { data, error } = await sb
    .from("ingredient_nutrients")
    .select("name, kcal_per_100g, protein_per_100g, carbs_per_100g, fat_per_100g")
    .in("name", ingredientNames);

  if(error){ console.error("Fehler beim Laden der Nährwerte:", error); throw error; }

  const lookup = {};
  (data || []).forEach(row => {
    lookup[row.name] = {
      kcal: Number(row.kcal_per_100g),
      protein: Number(row.protein_per_100g),
      carbs: Number(row.carbs_per_100g),
      fat: Number(row.fat_per_100g)
    };
  });
  return lookup;
}

async function loadRecipeWithNutrients(recipeId){
  const { data: recipe, error } = await sb
    .from("recipes")
    .select("id, title, servings, kcal, protein, carbs, fat, ingredients_structured")
    .eq("id", recipeId)
    .single();

  if(error){ console.error("Fehler beim Laden des Rezepts:", error); throw error; }

  const namesToLookup = (recipe.ingredients_structured || [])
    .filter(i => i.amount !== null && i.amount !== undefined)
    .map(i => i.name);

  const nutrientDb = await loadNutrients(namesToLookup);
  return { recipe, nutrientDb };
}

function calculatePersonalizedPortion(recipe, target, nutrientDb){
  const ingredients = recipe.ingredients_structured || [];
  const carbComponent = ingredients.find(i => i.role === "carb_component");
  const proteinComponent = ingredients.find(i => i.role === "protein_component");
  const fixedIngredients = ingredients.filter(i => i.role === "fixed" || !i.role);

  const fixedTotals = fixedIngredients.reduce((sum, ing) => {
    const data = nutrientDb[ing.name];
    if(!data || !ing.amount) return sum;
    const factor = ing.amount / 100;
    return {
      kcal: sum.kcal + data.kcal * factor,
      protein: sum.protein + data.protein * factor,
      carbs: sum.carbs + data.carbs * factor,
      fat: sum.fat + data.fat * factor
    };
  }, { kcal: 0, protein: 0, carbs: 0, fat: 0 });

  let carbResult = null;
  let carbContribution = { kcal: 0, protein: 0, carbs: 0, fat: 0 };
  if(carbComponent && nutrientDb[carbComponent.name]){
    const carbData = nutrientDb[carbComponent.name];
    const remainingCarbs = Math.max(0, target.carbs - fixedTotals.carbs);
    const carbAmount = carbData.carbs > 0 ? (remainingCarbs / carbData.carbs) * 100 : 0;
    carbContribution = {
      kcal: (carbAmount/100) * carbData.kcal,
      protein: (carbAmount/100) * carbData.protein,
      carbs: (carbAmount/100) * carbData.carbs,
      fat: (carbAmount/100) * carbData.fat
    };
    carbResult = { name: carbComponent.name, amount: Math.round(carbAmount), unit: carbComponent.unit };
  }

  let proteinResult = null;
  let proteinContribution = { kcal: 0, protein: 0, carbs: 0, fat: 0 };
  if(proteinComponent && nutrientDb[proteinComponent.name]){
    const proteinData = nutrientDb[proteinComponent.name];
    const remainingProtein = Math.max(0, target.protein - fixedTotals.protein - carbContribution.protein);
    const proteinAmount = proteinData.protein > 0 ? (remainingProtein / proteinData.protein) * 100 : 0;
    proteinContribution = {
      kcal: (proteinAmount/100) * proteinData.kcal,
      protein: (proteinAmount/100) * proteinData.protein,
      carbs: (proteinAmount/100) * proteinData.carbs,
      fat: (proteinAmount/100) * proteinData.fat
    };
    proteinResult = { name: proteinComponent.name, amount: Math.round(proteinAmount), unit: proteinComponent.unit };
  }

  const resultTotals = {
    kcal: Math.round(fixedTotals.kcal + carbContribution.kcal + proteinContribution.kcal),
    protein: Math.round(fixedTotals.protein + carbContribution.protein + proteinContribution.protein),
    carbs: Math.round(fixedTotals.carbs + carbContribution.carbs + proteinContribution.carbs),
    fat: Math.round(fixedTotals.fat + carbContribution.fat + proteinContribution.fat)
  };

  return {
    recipeTitle: recipe.title,
    carbComponent: carbResult,
    proteinComponent: proteinResult,
    fixedIngredients,
    target,
    resultTotals,
    diffFromTarget: {
      kcal: resultTotals.kcal - target.kcal,
      protein: resultTotals.protein - target.protein,
      carbs: resultTotals.carbs - target.carbs,
      fat: resultTotals.fat - target.fat
    }
  };
}

async function getPersonalizedPortion(recipeId, target){
  const { recipe, nutrientDb } = await loadRecipeWithNutrients(recipeId);
  return calculatePersonalizedPortion(recipe, target, nutrientDb);
}

/* ---------- HELPERS ---------- */
function escapeHtml(str){
  if(!str) return "";
  return str.replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }

// Verkleinert und komprimiert ein Bild im Browser, bevor es hochgeladen wird
// (max. Breite/Höhe + JPEG-Qualität) — reduziert Dateigröße spürbar, ohne dass
// die Person etwas davon merkt außer einem etwas schnelleren Upload.
function compressImageFile(file, maxDimension = 1200, quality = 0.78){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const objectUrl = URL.createObjectURL(file);
    img.onload = () => {
      let { width, height } = img;
      if(width > maxDimension || height > maxDimension){
        if(width > height){ height = Math.round(height * (maxDimension / width)); width = maxDimension; }
        else { width = Math.round(width * (maxDimension / height)); height = maxDimension; }
      }
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, width, height);
      URL.revokeObjectURL(objectUrl);
      canvas.toBlob((blob) => {
        if(!blob){ reject(new Error("Bildkomprimierung fehlgeschlagen")); return; }
        const compressedFile = new File([blob], (file.name || "photo").replace(/\.[^.]+$/, "") + ".jpg", { type: "image/jpeg" });
        resolve(compressedFile);
      }, "image/jpeg", quality);
    };
    img.onerror = () => { URL.revokeObjectURL(objectUrl); reject(new Error("Bild konnte nicht geladen werden")); };
    img.src = objectUrl;
  });
}
